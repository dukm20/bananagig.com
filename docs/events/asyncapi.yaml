  description: Event contract. The generic envelope, the infrastructure self-test event, the configuration registry events, the content registry events, the geography registry events, the identity account events, the email verification events, the phone verification events, the account security events (sessions, second factor, password reset) the consent events (acceptance and withdrawal of a legal document version) the catalogue events (category and service type activation, market availability) the Gig Template events (activation, pause, retirement, publication of a version, market availability) and the provider registration events (started, completed, cancelled) exist; other product events arrive with their features. Subjects follow bananagig.<domain>.<event>.v<version>.
defaultContentType: application/json
