  identity_accountRoleDeactivated:
    address: bananagig.identity.account-role-deactivated.v1
    description: An application role membership of an account was deactivated. Published through the transactional outbox (aggregate identity_account); the payload carries identifiers only, never a name, a token, a subject or any personal value.
