  identity_phone_verified:
    address: bananagig.identity.phone-verified.v1
    description: A phone number became the verified primary number of an account by code; replacedPhoneContactId names the primary it replaced. Published through the transactional outbox (aggregate identity_account); the payload carries identifiers only, never a phone number, a verification code or a hash.
    messages:
      IdentityPhoneVerified:
        $ref: "#/components/messages/IdentityPhoneVerified"
  identity_phone_verificationFailed:
    address: bananagig.identity.phone-verification-failed.v1
    description: A wrong phone verification code was submitted; locked is true when that attempt used the last allowed one. Published through the transactional outbox (aggregate identity_account); the payload carries identifiers only, never a phone number, a verification code or a hash.
    messages:
      IdentityPhoneVerificationFailed:
        $ref: "#/components/messages/IdentityPhoneVerificationFailed"
  identity_phone_changeRequested:
    address: bananagig.identity.phone-change-requested.v1
    description: A replacement for the verified primary number was requested; the old number stays active until the new one verifies. Published through the transactional outbox (aggregate identity_account); the payload carries identifiers only, never a phone number, a verification code or a hash.
    messages:
      IdentityPhoneChangeRequested:
        $ref: "#/components/messages/IdentityPhoneChangeRequested"
  identity_security_sessionCreated:
    address: bananagig.identity.session-created.v1
    description: The API saw a new login session of an account for the first time (an application session was created). Published through the transactional outbox (aggregate identity_account); the payload carries identifiers only, never a token, a Keycloak session id, a device secret, an address, a password, a code or a link.
    messages:
      IdentitySessionCreated:
        $ref: "#/components/messages/IdentitySessionCreated"
  identity_security_sessionRevoked:
    address: bananagig.identity.session-revoked.v1
    description: "An application session ended: the person signed out, revoked it from another session, removed its browser, or the identity provider ended it. reason names why. A revoked session is refused by the API at once. Published through the transactional outbox (aggregate identity_account); the payload carries identifiers only, never a token, a Keycloak session id, a device secret, an address, a password, a code or a link."
    messages:
      IdentitySessionRevoked:
        $ref: "#/components/messages/IdentitySessionRevoked"
  identity_security_sessionsRevokedAll:
    address: bananagig.identity.sessions-revoked-all.v1
    description: "The person signed out everywhere: all sessions (except the current one unless includeCurrent) were revoked and the account revocation watermark was raised. Published through the transactional outbox (aggregate identity_account); the payload carries identifiers only, never a token, a Keycloak session id, a device secret, an address, a password, a code or a link."
    messages:
      IdentitySessionsRevokedAll:
        $ref: "#/components/messages/IdentitySessionsRevokedAll"
  identity_security_mfaEnabled:
    address: bananagig.identity.mfa-enabled.v1
    description: A second factor (method TOTP or RECOVERY_CODES) was observed as set up in the identity provider. The payload never carries a secret or a code. Published through the transactional outbox (aggregate identity_account); the payload carries identifiers only, never a token, a Keycloak session id, a device secret, an address, a password, a code or a link.
    messages:
      IdentityMfaEnabled:
        $ref: "#/components/messages/IdentityMfaEnabled"
  identity_security_mfaDisabled:
    address: bananagig.identity.mfa-disabled.v1
    description: A second factor (method TOTP or RECOVERY_CODES) was observed as removed in the identity provider. Published through the transactional outbox (aggregate identity_account); the payload carries identifiers only, never a token, a Keycloak session id, a device secret, an address, a password, a code or a link.
    messages:
      IdentityMfaDisabled:
        $ref: "#/components/messages/IdentityMfaDisabled"
  identity_security_passwordResetRequested:
    address: bananagig.identity.password-reset-requested.v1
    description: A password reset email was requested for an account (through the public request or by the owner). The payload carries the account id only, never an address or a link. Published through the transactional outbox (aggregate identity_account); the payload carries identifiers only, never a token, a Keycloak session id, a device secret, an address, a password, a code or a link.
