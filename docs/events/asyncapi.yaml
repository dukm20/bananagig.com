  schemas:
    EventEnvelope:
      type: object
      properties:
        eventId:
          type: string
          format: uuid
          pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
        eventType:
          type: string
          pattern: ^bananagig\.[a-z][a-z0-9-]*\.[a-z][a-z0-9-]*\.v[1-9][0-9]*$
        eventVersion:
          type: integer
          exclusiveMinimum: 0
          maximum: 9007199254740991
        occurredAt:
