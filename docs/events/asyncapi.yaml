    channel:
      $ref: "#/channels/identity_accountStatusChanged"
    summary: The status of an account changed along the account status machine (the creation of an account is announced by account-created instead).
  sendIdentityEmailContactAdded:
    action: send
    channel:
      $ref: "#/channels/identity_email_contactAdded"
    summary: An email address was added to an account as a pending first address, as a pending replacement of the verified primary, or created verified by a trusted identity provider.
  sendIdentityEmailVerificationSent:
    action: send
    channel:
      $ref: "#/channels/identity_email_verificationSent"
    summary: A verification email (one-time code and magic link) was accepted by the delivery provider for a pending address.
  sendIdentityEmailVerified:
    action: send
    channel:
      $ref: "#/channels/identity_email_verified"
    summary: An email address became the verified primary address of an account, by code, by magic link or because a trusted identity provider reported it verified; replacedEmailContactId names the primary it replaced.
  sendIdentityEmailVerificationFailed:
    action: send
    channel:
      $ref: "#/channels/identity_email_verificationFailed"
    summary: A wrong verification code was submitted; locked is true when that attempt used the last allowed one.
  sendIdentityEmailChangeRequested:
    action: send
    channel:
      $ref: "#/channels/identity_email_changeRequested"
    summary: A replacement for the verified primary address was requested; the old address stays active until the new one verifies.
  sendIdentityPhoneContactAdded:
    action: send
    channel:
      $ref: "#/channels/identity_phone_contactAdded"
    summary: A phone number was added to an account as a pending first number or as a pending replacement of the verified primary.
  sendIdentityPhoneVerificationSent:
    action: send
    channel:
      $ref: "#/channels/identity_phone_verificationSent"
    summary: A verification SMS (one-time code) was accepted by the SMS sender for a pending number.
  sendIdentityPhoneVerified:
    action: send
    channel:
      $ref: "#/channels/identity_phone_verified"
    summary: A phone number became the verified primary number of an account by code; replacedPhoneContactId names the primary it replaced.
  sendIdentityPhoneVerificationFailed:
    action: send
    channel:
      $ref: "#/channels/identity_phone_verificationFailed"
    summary: A wrong phone verification code was submitted; locked is true when that attempt used the last allowed one.
  sendIdentityPhoneChangeRequested:
    action: send
    channel:
      $ref: "#/channels/identity_phone_changeRequested"
    summary: A replacement for the verified primary number was requested; the old number stays active until the new one verifies.
  sendIdentitySessionCreated:
    action: send
    channel:
      $ref: "#/channels/identity_security_sessionCreated"
    summary: The API saw a new login session of an account for the first time (an application session was created).
  sendIdentitySessionRevoked:
    action: send
    channel:
      $ref: "#/channels/identity_security_sessionRevoked"
    summary: "An application session ended: the person signed out, revoked it from another session, removed its browser, or the identity provider ended it. reason names why. A revoked session is refused by the API at once."
  sendIdentitySessionsRevokedAll:
    action: send
    channel:
      $ref: "#/channels/identity_security_sessionsRevokedAll"
    summary: "The person signed out everywhere: all sessions (except the current one unless includeCurrent) were revoked and the account revocation watermark was raised."
  sendIdentityMfaEnabled:
    action: send
    channel:
      $ref: "#/channels/identity_security_mfaEnabled"
    summary: A second factor (method TOTP or RECOVERY_CODES) was observed as set up in the identity provider. The payload never carries a secret or a code.
  sendIdentityMfaDisabled:
    action: send
    channel:
      $ref: "#/channels/identity_security_mfaDisabled"
    summary: A second factor (method TOTP or RECOVERY_CODES) was observed as removed in the identity provider.
  sendIdentityPasswordResetRequested:
    action: send
    channel:
      $ref: "#/channels/identity_security_passwordResetRequested"
    summary: A password reset email was requested for an account (through the public request or by the owner). The payload carries the account id only, never an address or a link.
  sendIdentityPasswordResetCompleted:
    action: send
    channel:
      $ref: "#/channels/identity_security_passwordResetCompleted"
    summary: "A password reset was completed: the identity provider password changed after a reset request. Observed, never the password."
  sendIdentityConsentAccepted:
    action: send
    channel:
      $ref: "#/channels/identity_consent_accepted"
    summary: An account accepted an exact version of a legal document for a purpose (a consent event ACCEPTED was appended). The payload names the purpose, the consent event, its sequence number and the content version id; the hash and the locale are reachable through that version. Never legal text.
  sendIdentityConsentWithdrawn:
    action: send
    channel:
      $ref: "#/channels/identity_consent_withdrawn"
    summary: An account withdrew the consent it had given for a withdrawable purpose (a consent event WITHDRAWN was appended). The payload carries the same identifiers as the acceptance event, never legal text.
  sendCatalogCategoryActivated:
    action: send
    channel:
      $ref: "#/channels/catalog_categoryActivated"
    summary: A category became ACTIVE (DRAFT or INACTIVE to ACTIVE).
  sendCatalogCategoryDeactivated:
    action: send
    channel:
      $ref: "#/channels/catalog_categoryDeactivated"
    summary: An ACTIVE category left ACTIVE (paused as INACTIVE or retired). Moving a DRAFT or INACTIVE category to RETIRED emits no event.
  sendCatalogServiceTypeActivated:
    action: send
    channel:
      $ref: "#/channels/catalog_serviceTypeActivated"
    summary: A service type became ACTIVE (DRAFT or INACTIVE to ACTIVE).
  sendCatalogServiceTypeDeactivated:
    action: send
    channel:
      $ref: "#/channels/catalog_serviceTypeDeactivated"
    summary: An ACTIVE service type left ACTIVE (paused as INACTIVE or retired).
  sendCatalogAvailabilityChanged:
    action: send
    channel:
      $ref: "#/channels/catalog_availabilityChanged"
    summary: A category or a service type was offered, withdrawn or reordered in a market (a row of the market availability changed). Switching a category off in a market also emits one event per service type it switched off.
  sendGigTemplateActivated:
    action: send
    channel:
      $ref: "#/channels/gigTemplate_activated"
    summary: A Gig Template became ACTIVE (DRAFT or INACTIVE to ACTIVE).
  sendGigTemplateDeactivated:
    action: send
    channel:
      $ref: "#/channels/gigTemplate_deactivated"
    summary: "An ACTIVE Gig Template was paused (INACTIVE): nothing new is built from it. Retiring emits GigTemplateRetired instead."
  sendGigTemplateRetired:
    action: send
    channel:
      $ref: "#/channels/gigTemplate_retired"
    summary: "A Gig Template became RETIRED (terminal): its ACTIVE version is closed and no Gig can be built from it; every version stays."
  sendGigTemplatePublished:
    action: send
    channel:
      $ref: "#/channels/gigTemplate_published"
    summary: A version of a Gig Template was published (it is now the frozen ACTIVE version; the previous one is SUPERSEDED). The payload carries the exact version id a Gig will reference.
  sendGigTemplateAvailabilityChanged:
    action: send
    channel:
      $ref: "#/channels/gigTemplate_availabilityChanged"
    summary: A Gig Template was offered, withdrawn or reordered in a market (a row of the market availability changed).
  sendProviderRegistrationStarted:
    action: send
    channel:
      $ref: "#/channels/provider_registrationStarted"
    summary: "An account started (or restarted, as a new attempt) its provider registration. The same account: the PROVIDER role is requested as PENDING in the same transaction."
  sendProviderRegistrationCompleted:
    action: send
    channel:
      $ref: "#/channels/provider_registrationCompleted"
    summary: A provider registration was completed by the server (every step it owns or composes was complete). This is NOT verification, subscription or go-live; the PROVIDER role became ACTIVE in the same transaction.
  sendProviderRegistrationCancelled:
    action: send
    channel:
      $ref: "#/channels/provider_registrationCancelled"
    summary: An IN_PROGRESS provider registration was cancelled. The account and its roles are untouched.
