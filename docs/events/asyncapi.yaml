    messages:
      IdentityExternalIdentityLinked:
        $ref: "#/components/messages/IdentityExternalIdentityLinked"
  identity_accountRoleGranted:
    address: bananagig.identity.account-role-granted.v1
    description: An application role (for example CUSTOMER or PROVIDER) became ACTIVE for an account, by a new grant or a reactivation. Published through the transactional outbox (aggregate identity_account); the payload carries identifiers only, never a name, a token, a subject or any personal value.
