    messages:
      CatalogAvailabilityChanged:
        $ref: "#/components/messages/CatalogAvailabilityChanged"
  gigTemplate_activated:
    address: bananagig.catalog.gig-template-activated.v1
    description: A Gig Template became ACTIVE (DRAFT or INACTIVE to ACTIVE). Published through the transactional outbox (aggregate catalog_gig_template); the payload carries codes and ids only, never display text.
    messages:
      GigTemplateActivated:
        $ref: "#/components/messages/GigTemplateActivated"
  gigTemplate_deactivated:
    address: bananagig.catalog.gig-template-deactivated.v1
    description: "An ACTIVE Gig Template was paused (INACTIVE): nothing new is built from it. Retiring emits GigTemplateRetired instead. Published through the transactional outbox (aggregate catalog_gig_template); the payload carries codes and ids only, never display text."
    messages:
      GigTemplateDeactivated:
        $ref: "#/components/messages/GigTemplateDeactivated"
  gigTemplate_retired:
    address: bananagig.catalog.gig-template-retired.v1
    description: "A Gig Template became RETIRED (terminal): its ACTIVE version is closed and no Gig can be built from it; every version stays. Published through the transactional outbox (aggregate catalog_gig_template); the payload carries codes and ids only, never display text."
    messages:
      GigTemplateRetired:
        $ref: "#/components/messages/GigTemplateRetired"
  gigTemplate_published:
    address: bananagig.catalog.gig-template-published.v1
    description: A version of a Gig Template was published (it is now the frozen ACTIVE version; the previous one is SUPERSEDED). The payload carries the exact version id a Gig will reference. Published through the transactional outbox (aggregate catalog_gig_template); the payload carries codes and ids only, never display text.
    messages:
      GigTemplatePublished:
        $ref: "#/components/messages/GigTemplatePublished"
  gigTemplate_availabilityChanged:
    address: bananagig.catalog.gig-template-availability-changed.v1
    description: A Gig Template was offered, withdrawn or reordered in a market (a row of the market availability changed). Published through the transactional outbox (aggregate catalog_market_availability); the payload carries codes and ids only, never display text.
    messages:
      GigTemplateAvailabilityChanged:
        $ref: "#/components/messages/GigTemplateAvailabilityChanged"
  provider_registrationStarted:
    address: bananagig.provider.registration-started.v1
    description: "An account started (or restarted, as a new attempt) its provider registration. The same account: the PROVIDER role is requested as PENDING in the same transaction. Published through the transactional outbox (aggregate provider_registration); the payload carries identifiers and codes only, never a contact, a name or a text."
    messages:
      ProviderRegistrationStarted:
        $ref: "#/components/messages/ProviderRegistrationStarted"
  provider_registrationCompleted:
    address: bananagig.provider.registration-completed.v1
    description: A provider registration was completed by the server (every step it owns or composes was complete). This is NOT verification, subscription or go-live; the PROVIDER role became ACTIVE in the same transaction. Published through the transactional outbox (aggregate provider_registration); the payload carries identifiers and codes only, never a contact, a name or a text.
    messages:
      ProviderRegistrationCompleted:
        $ref: "#/components/messages/ProviderRegistrationCompleted"
  provider_registrationCancelled:
    address: bananagig.provider.registration-cancelled.v1
    description: An IN_PROGRESS provider registration was cancelled. The account and its roles are untouched. Published through the transactional outbox (aggregate provider_registration); the payload carries identifiers and codes only, never a contact, a name or a text.
    messages:
      ProviderRegistrationCancelled:
        $ref: "#/components/messages/ProviderRegistrationCancelled"
