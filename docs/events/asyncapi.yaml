  identity_security_passwordResetCompleted:
    address: bananagig.identity.password-reset-completed.v1
    description: "A password reset was completed: the identity provider password changed after a reset request. Observed, never the password. Published through the transactional outbox (aggregate identity_account); the payload carries identifiers only, never a token, a Keycloak session id, a device secret, an address, a password, a code or a link."
