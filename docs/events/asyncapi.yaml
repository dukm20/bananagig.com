    messages:
      IdentityAccountStatusChanged:
        $ref: "#/components/messages/IdentityAccountStatusChanged"
  identity_email_contactAdded:
    address: bananagig.identity.email-contact-added.v1
    description: An email address was added to an account as a pending first address, as a pending replacement of the verified primary, or created verified by a trusted identity provider. Published through the transactional outbox (aggregate identity_account); the payload carries identifiers only, never an email address, a verification code, a token or a hash.
    messages:
      IdentityEmailContactAdded:
        $ref: "#/components/messages/IdentityEmailContactAdded"
  identity_email_verificationSent:
    address: bananagig.identity.email-verification-sent.v1
    description: A verification email (one-time code and magic link) was accepted by the delivery provider for a pending address. Published through the transactional outbox (aggregate identity_account); the payload carries identifiers only, never an email address, a verification code, a token or a hash.
    messages:
      IdentityEmailVerificationSent:
        $ref: "#/components/messages/IdentityEmailVerificationSent"
  identity_email_verified:
    address: bananagig.identity.email-verified.v1
    description: An email address became the verified primary address of an account, by code, by magic link or because a trusted identity provider reported it verified; replacedEmailContactId names the primary it replaced. Published through the transactional outbox (aggregate identity_account); the payload carries identifiers only, never an email address, a verification code, a token or a hash.
    messages:
      IdentityEmailVerified:
        $ref: "#/components/messages/IdentityEmailVerified"
  identity_email_verificationFailed:
    address: bananagig.identity.email-verification-failed.v1
    description: A wrong verification code was submitted; locked is true when that attempt used the last allowed one. Published through the transactional outbox (aggregate identity_account); the payload carries identifiers only, never an email address, a verification code, a token or a hash.
    messages:
      IdentityEmailVerificationFailed:
        $ref: "#/components/messages/IdentityEmailVerificationFailed"
  identity_email_changeRequested:
    address: bananagig.identity.email-change-requested.v1
    description: A replacement for the verified primary address was requested; the old address stays active until the new one verifies. Published through the transactional outbox (aggregate identity_account); the payload carries identifiers only, never an email address, a verification code, a token or a hash.
