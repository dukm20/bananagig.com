  /api/v1/content/resolve:
    post:
      operationId: resolveContent
      summary: "Resolve and render one entry for a locale and context. Public: PUBLIC entries only (INTERNAL behaves as not found), no template, no `at`. A bearer token with content-read also sees INTERNAL entries and may use `at` and `includeTemplate`."
      tags: *a3
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
