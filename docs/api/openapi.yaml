  /api/v1/geography/markets/{code}/defaults:
    get:
      operationId: getGeographyMarketDefaults
      summary: "Data-driven defaults of a market (locale, currency, time zone, units and formats), from reference data with no code fallback. Public: ACTIVE markets in effect only. Callers with geography-read (or geography-write) may also fetch defaults for PLANNED and INACTIVE markets"
      tags: *a5
      parameters:
        - schema:
            type: string
            maxLength: 60
            pattern: ^[a-z][a-z0-9]*(-[a-z0-9]+)*$
          in: path
          name: code
          required: true
      security: []
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      market:
                        type: object
                        properties:
                          code:
                            type: string
                          name:
                            type: string
                          countryCode:
                            type: string
                        required:
                          - code
                          - name
                          - countryCode
                        additionalProperties: false
                      country:
                        type: object
                        properties:
                          code:
                            type: string
                          dialingCode:
                            type: string
                        required:
                          - code
                          - dialingCode
                        additionalProperties: false
                      currency:
                        type: object
                        properties:
                          code:
                            type: string
                          minorUnitDigits:
                            type: integer
                            minimum: -9007199254740991
                            maximum: 9007199254740991
                          symbol:
                            type:
                              - "null"
                              - string
                        required:
                          - code
                          - minorUnitDigits
                          - symbol
                        additionalProperties: false
                      locale:
