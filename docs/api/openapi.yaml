                      key:
                        type: string
                      contentType:
                        type: string
                        enum:
                          - PLAIN_TEXT
                          - RICH_TEXT
                          - MARKDOWN
                          - EMAIL_SUBJECT
                          - EMAIL_BODY
                          - PUSH_TITLE
                          - PUSH_BODY
                          - LEGAL
                          - HELP_ARTICLE
                          - UI_LABEL
                      requestedLocale:
                        type: string
                      resolvedLocale:
                        type: string
                      fallback:
                        type: object
                        properties:
                          applied:
                            type: boolean
                          chain:
                            type: array
                            items:
                              type: string
                        required:
                          - applied
                          - chain
                        additionalProperties: false
                      version:
                        type: integer
                        minimum: -9007199254740991
                        maximum: 9007199254740991
                      versionId:
                        type: string
                      sourceScope:
                        type: string
                        enum:
                          - PLATFORM
                          - COUNTRY
                          - MARKET
                      scopeRef:
                        type:
                          - "null"
                          - string
                      effectiveFrom:
                        type: string
                      effectiveTo:
                        description: End of the effective period; always null for callers without content-read (it would disclose scheduled copy)
                        type:
