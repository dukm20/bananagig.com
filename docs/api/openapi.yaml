  /api/v1/content/entries/{key}/versions:
    post:
      operationId: createContentVersion
      summary: Create a DRAFT version of an entry for a locale and scope (validated, with a dry render)
      tags: *a3
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                locale:
                  type: string
                  maxLength: 20
                  pattern: ^[a-z]{2,3}(-[A-Z][a-z]{3})?(-([A-Z]{2}|[0-9]{3}))?$
                scopeType:
                  default: PLATFORM
                  type: string
                  enum:
                    - PLATFORM
                    - COUNTRY
                    - MARKET
                scopeRef:
                  anyOf:
                    - type: string
                      pattern: ^[A-Za-z0-9._:-]{1,200}$
                    - type: "null"
                body:
                  type: string
                  minLength: 1
                  maxLength: 200000
                effectiveFrom:
                  type: string
                  format: date-time
                  pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z|([+-](?:[01]\d|2[0-3]):[0-5]\d)))$
