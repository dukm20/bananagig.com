                    - type: "null"
                reason:
                  type: string
                  minLength: 1
                  maxLength: 1000
              required:
                - locale
                - scopeType
                - body
                - reason
              additionalProperties: false
      parameters:
        - schema:
            type: string
            maxLength: 160
          in: path
          name: key
          required: true
      security: *a4
      responses:
        "201":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
