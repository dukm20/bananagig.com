    put:
      operationId: updateGeographyCountry
      summary: Change the provided fields of a country (ISO codes are identity; supportedLocales and timeZones replace the sets)
      tags: *a5
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                displayNameContentKey:
                  type: string
                  maxLength: 160
                  pattern: ^[a-z][a-z0-9_]*([.][a-z][a-z0-9_]*)+$
                dialingCode:
                  type: string
                  pattern: ^[+][0-9]{1,4}$
                defaultCurrencyCode:
                  type: string
                  pattern: ^[A-Z]{3}$
                defaultLocale:
                  type: string
                  maxLength: 20
                  pattern: ^[a-z]{2,3}(-[A-Z][a-z]{3})?(-([A-Z]{2}|[0-9]{3}))?$
                supportedLocales:
                  minItems: 1
                  maxItems: 30
                  type: array
                  items:
                    type: string
                    maxLength: 20
                    pattern: ^[a-z]{2,3}(-[A-Z][a-z]{3})?(-([A-Z]{2}|[0-9]{3}))?$
                timeZones:
                  minItems: 1
                  maxItems: 40
                  type: array
                  items:
                    type: string
                    maxLength: 64
                    pattern: ^[A-Za-z][A-Za-z0-9_+-]*(\/[A-Za-z0-9_+-]+)*$
                distanceUnit:
                  type: string
                  enum:
                    - MILES
                    - KILOMETERS
                firstDayOfWeek:
                  type: string
                  enum:
                    - MONDAY
                    - TUESDAY
                    - WEDNESDAY
                    - THURSDAY
                    - FRIDAY
                    - SATURDAY
                    - SUNDAY
                dateFormat:
                  type: string
                  enum:
                    - MDY
                    - DMY
                    - YMD
                timeFormat:
                  type: string
                  enum:
                    - 12_HOUR
                    - 24_HOUR
                reason:
                  type: string
                  minLength: 1
                  maxLength: 1000
              required:
                - reason
              additionalProperties: false
      parameters:
        - schema:
            type: string
            pattern: ^[A-Z]{2}$
          in: path
          name: code
          required: true
      security: *a6
      responses:
