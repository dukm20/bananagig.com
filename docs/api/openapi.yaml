  /api/v1/content/snapshots/{id}:
    get:
      operationId: getContentSnapshot
      summary: Read a snapshot (the exact versions used, with template source)
      tags: *a3
      parameters:
        - schema:
            type: string
            format: uuid
          in: path
          name: id
          required: true
      security: *a4
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      snapshotId:
                        type: string
                      evaluatedAt:
                        type: string
                      requestedLocale:
                        type: string
                      context:
                        type: object
                        properties:
                          country:
                            type: string
                            pattern: ^[A-Za-z0-9._:-]{1,200}$
                          market:
                            type: string
                            pattern: ^[A-Za-z0-9._:-]{1,200}$
                          marketDefaultLocale:
                            type: string
                            maxLength: 20
                            pattern: ^[a-z]{2,3}(-[A-Z][a-z]{3})?(-([A-Z]{2}|[0-9]{3}))?$
                        additionalProperties: false
                      purpose:
                        type: string
                      createdAt:
                        type: string
                      items:
                        type: array
                        items:
                          type: object
                          properties:
                            key:
                              type: string
                            contentType:
                              type: string
                              enum:
                                - PLAIN_TEXT
                                - RICH_TEXT
                                - MARKDOWN
                                - EMAIL_SUBJECT
                                - EMAIL_BODY
                                - PUSH_TITLE
                                - PUSH_BODY
                                - LEGAL
                                - HELP_ARTICLE
                                - UI_LABEL
                            requestedLocale:
                              type: string
                            resolvedLocale:
                              type: string
                            version:
                              type: integer
                              minimum: -9007199254740991
                              maximum: 9007199254740991
                            versionId:
                              type: string
                            sourceScope:
                              type: string
                              enum:
                                - PLATFORM
                                - COUNTRY
                                - MARKET
                            scopeRef:
                              type:
                                - "null"
                                - string
                            effectiveFrom:
                              type: string
                            bodySha256:
                              type: string
                            template:
                              type: string
                            body:
                              type: string
                          required:
                            - key
                            - contentType
                            - requestedLocale
                            - resolvedLocale
                            - version
                            - versionId
                            - sourceScope
                            - scopeRef
                            - effectiveFrom
                            - bodySha256
                            - body
                          additionalProperties: false
                    required:
                      - snapshotId
                      - evaluatedAt
                      - requestedLocale
                      - context
                      - purpose
                      - createdAt
