apiVersion: 1
datasources:
  - name: Prometheus
    type: prometheus
    uid: prometheus
    url: http://prometheus-metrics:9090
    isDefault: true
  - name: Loki
    type: loki
    uid: loki
    url: http://loki-logs:3100
  - name: Tempo
    type: tempo
    uid: tempo
    url: http://tempo-traces:3200
    jsonData:
      tracesToLogsV2:
        datasourceUid: loki
