global:
  scrape_interval: 15s
scrape_configs:
  - job_name: prometheus
    static_configs: [{ targets: ['localhost:9090'] }]
  - job_name: web
    static_configs: [{ targets: ['web:3000'] }]
  - job_name: api
    static_configs: [{ targets: ['api:3000'] }]
  - job_name: worker
    static_configs: [{ targets: ['worker:3000'] }]
